{{define "login.html"}}{{template "head" .}}
<section class="narrow">
<h1>Log in</h1>
{{with .Data}}
{{if .LocalLogin}}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{.Next}}">
  <label>Username <input name="username" value="{{.Username}}" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
{{end}}
{{if .OIDC}}
{{if .LocalLogin}}<p class="or">or</p>{{end}}
<p><a class="button" href="/auth/oidc/start?next={{.Next}}">{{.OIDCName}}</a></p>
{{end}}
{{end}}
</section>
{{template "foot" .}}{{end}}
