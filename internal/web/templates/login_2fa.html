{{define "login_2fa.html"}}{{template "head" .}}
<div class="card card-md"><div class="card-body">
  <h2 class="h2 text-center mb-3">Second step</h2>
  <p class="text-secondary">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  <form method="post" action="/login/2fa">
    <input type="hidden" name="challenge" value="{{.Data}}">
    <div class="mb-3"><label class="form-label" for="code">Code</label>
      <input class="form-control" id="code" name="code" inputmode="text" autocomplete="one-time-code" required autofocus></div>
    <label class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" checked><span class="form-check-label">Do not ask for a code on this device for three weeks</span></label>
    <button type="submit" class="btn btn-primary w-100">Log in</button>
  </form>
</div></div>
<div class="text-center text-secondary mt-3"><a href="/login">Start again</a></div>
{{template "foot" .}}{{end}}
