; Asterisk for the controller's SIP interop test (CI). Two users, 6001 and
; 6002, both registered by the controller; calls between them go through
; Asterisk, which relays the media (direct_media=no).

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5060

[endpoint-tmpl](!)
type=endpoint
context=internal
disallow=all
allow=g722,alaw,ulaw
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[aor-tmpl](!)
type=aor
max_contacts=1
remove_existing=yes

[6001](endpoint-tmpl)
auth=6001-auth
aors=6001
[6001-auth]
type=auth
auth_type=userpass
username=6001
password=interop-6001
[6001](aor-tmpl)

[6002](endpoint-tmpl)
auth=6002-auth
aors=6002
[6002-auth]
type=auth
auth_type=userpass
username=6002
password=interop-6002
[6002](aor-tmpl)
