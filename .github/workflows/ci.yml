# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: "v2.15.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        run: |
          v=${GOLANGCI_LINT_VERSION#v}
          base=https://github.com/golangci/golangci-lint/releases/download/$GOLANGCI_LINT_VERSION
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/golangci-lint-$v-linux-amd64.tar.gz"
          curl -fsSLO "$base/golangci-lint-$v-checksums.txt"
          grep " golangci-lint-$v-linux-amd64.tar.gz\$" "golangci-lint-$v-checksums.txt" | sha256sum -c
          tar xzf "golangci-lint-$v-linux-amd64.tar.gz"
          echo "$RUNNER_TEMP/golangci-lint-$v-linux-amd64" >> "$GITHUB_PATH"
      # cdect needs the private openDECTcell submodule (see the test job), so it
      # is left out here.
      - name: Lint
        run: golangci-lint run --timeout=5m $(go list ./... | grep -v /dect/cdect)

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      OPENDECTCELL_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the opendectcell submodule (private; needs OPENDECTCELL_READ_TOKEN)
        id: sub
        env:
          TOKEN: ${{ secrets.OPENDECTCELL_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::OPENDECTCELL_READ_TOKEN is not set: the libopendectcell cgo package (internal/dect/cdect) is NOT built or tested. See docs/libopendectcell-integration.md §11, L7."
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1
          echo "have=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Licence headers
        run: |
          missing=$(git ls-files '*.go' '*.sql' '*.c' '*.h' '*.html' '*.css' '*.yml' '*.yaml' Dockerfile \
            | grep -v '^third_party/' | xargs grep -L 'SPDX-License-Identifier: AGPL-3.0-or-later' || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi
      - name: Test
        run: |
          if [ "${{ steps.sub.outputs.have }}" = "true" ]; then
            go test -race -count=1 ./...
            GOEXPERIMENT=cgocheck2 go test -count=1 ./internal/dect/...
          else
            go test -race -count=1 $(go list ./... | grep -v /dect/cdect)
          fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/...

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t opendectcell-controller:ci .
      - name: Compose bring-up smoke test
        run: |
          docker compose up -d
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 2; done
          docker compose exec -T controller opendectcell-controller migrate status
          printf 'ci admin password\n' | docker compose exec -T controller opendectcell-controller user create --username admin --role admin
          curl -fsS http://127.0.0.1:8080/readyz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Sec-Fetch-Site: same-origin' \
            -d 'username=admin&password=ci+admin+password&next=/' http://127.0.0.1:8080/login)
          test "$code" = 303
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
