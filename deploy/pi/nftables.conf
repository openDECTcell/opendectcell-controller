#!/usr/sbin/nft -f
# SPDX-License-Identifier: AGPL-3.0-or-later
# The test ground's host firewall: inbound is dropped except what is listed. Only this table is replaced; Docker's own
# tables are left alone (a published port is forwarded, not delivered here, so Docker publishes the cells' and SIP ports on
# the LAN IPv4 address only and the line has no public IPv4; see docs/test-ground.md).
table inet opendectcell_filter
delete table inet opendectcell_filter

table inet opendectcell_filter {
    set lan4 { type ipv4_addr; flags interval; elements = { 192.168.1.0/24 } }
    # the LAN's /64 prefixes: the unique-local one and the provider's (the router hands out both)
    set lan6 { type ipv6_addr; flags interval; elements = { fd12:3456:789a::/64, 2001:db8:1::/64 } }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # IPv6 does not work without these (neighbour discovery, router advertisements, path MTU); echo is rate limited
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
            nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply } limit rate 10/second accept
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 saddr fe80::/10 udp dport 546 accept      # DHCPv6 replies

        # administration: from the LAN only, never from the internet
        tcp dport 22 ip saddr @lan4 accept
        tcp dport 22 ip6 saddr @lan6 accept
        udp dport 5353 ip saddr @lan4 accept          # mDNS (opendectcell-pi.local)
        udp dport 5353 ip6 saddr @lan6 accept

        # the web interface, through the TLS proxy (Caddy runs in the host network); 80 is for the certificate
        # authority's check and the redirect to https
        tcp dport { 80, 443 } accept
    }
}
