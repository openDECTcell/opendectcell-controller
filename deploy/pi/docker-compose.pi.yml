# The test ground (a Raspberry Pi 4, docs/test-ground.md): the project's docker-compose.yml plus a TLS proxy and the
# settings of this site. Run from the repository root:
#   docker compose --env-file deploy/pi/.env -f docker-compose.yml -f deploy/pi/docker-compose.pi.yml up -d
name: opendectcell

services:
  controller:
    environment:
      OPENDECTCELL_HTTP_BASE_URL: https://${OPENDECTCELL_HOST:-opendectcell.example.org}
      # the proxy reaches the controller through the compose network's gateway: believe X-Forwarded-For from there only
      OPENDECTCELL_HTTP_TRUSTED_PROXIES: 172.29.88.0/24
      # the cells (the lab's boxes) are on the LAN: as they reach the controller, by its IPv4 address
      OPENDECTCELL_CELLS_PUBLIC_ADDRESS: ${OPENDECTCELL_LAN_IP:?set OPENDECTCELL_LAN_IP in deploy/pi/.env}:7300
      OPENDECTCELL_CELLS_MEDIA_IP: ${OPENDECTCELL_LAN_IP}
      OPENDECTCELL_SIP_MEDIA_IP: ${OPENDECTCELL_LAN_IP}
      # the soak's configuration (docs/adr/0003-stack-isolation.md): a worker per CPU
      OPENDECTCELL_CELLS_STACK_WORKERS: ${OPENDECTCELL_STACK_WORKERS:-4}

  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    # in the host network: it listens on the host's IPv6 (and IPv4) addresses itself, whatever Docker does with IPv6
    network_mode: host
    environment:
      OPENDECTCELL_HOST: ${OPENDECTCELL_HOST:-opendectcell.example.org}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./deploy/pi/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # the certificates and the account key: back this up, or a rebuild asks for new ones
      - caddy_config:/config
    depends_on:
      controller:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.88.0/24

volumes:
  caddy_data:
  caddy_config:
