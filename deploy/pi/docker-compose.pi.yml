# The test ground (a Raspberry Pi 4, docs/test-ground.md): the project's docker-compose.yml plus a TLS proxy, the
# controller in the host network and the settings of this site. Run from the repository root:
#   docker compose --env-file deploy/pi/.env -f docker-compose.yml -f deploy/pi/docker-compose.pi.yml up -d
name: opendectcell

services:
  db:
    # the controller runs in the host network (below) and reaches the database on the loopback address
    ports:
      - "127.0.0.1:5432:5432"

  controller:
    # In the host network: it listens on the host's own IPv6 and IPv4 addresses, so remote cells reach it directly (no
    # port mapping, no address translation: the cell's real address is seen, and each cell is sent its speech to the address
    # it connected to, OPENDECTCELL_CELLS_MEDIA_IP=auto). What is reachable from where is decided by the host firewall
    # (deploy/pi/nftables.conf), not by Docker.
    network_mode: host
    ports: !reset []
    extra_hosts:
      - "db:127.0.0.1"
    environment:
      OPENDECTCELL_HTTP_BASE_URL: https://${OPENDECTCELL_HOST:-opendectcell.example.org}
      # only the proxy on this host talks to the web port, and only on the loopback address
      OPENDECTCELL_HTTP_LISTEN: 127.0.0.1:8080
      OPENDECTCELL_HTTP_TRUSTED_PROXIES: 127.0.0.1/32,::1/128
      # the cells find the controller by name (the AAAA record): remote ones over IPv6 across the internet, the lab's boxes
      # over the LAN; speech goes to the address each cell connected to
      OPENDECTCELL_CELLS_PUBLIC_ADDRESS: ${OPENDECTCELL_HOST:-opendectcell.example.org}:7300
      OPENDECTCELL_CELLS_MEDIA_IP: auto
      # SIP is for the LAN only (a peer for the soak's scripted calls): not on the internet's addresses
      OPENDECTCELL_SIP_UDP_LISTEN: ${OPENDECTCELL_LAN_IP:?set OPENDECTCELL_LAN_IP in deploy/pi/.env}:5060
      OPENDECTCELL_SIP_TCP_LISTEN: ${OPENDECTCELL_LAN_IP}:5060
      OPENDECTCELL_SIP_MEDIA_IP: ${OPENDECTCELL_LAN_IP}
      # the soak's configuration (docs/adr/0003-stack-isolation.md): a worker per CPU
      OPENDECTCELL_CELLS_STACK_WORKERS: ${OPENDECTCELL_STACK_WORKERS:-4}

  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    # in the host network: it listens on the host's IPv6 (and IPv4) addresses itself, whatever Docker does with IPv6
    network_mode: host
    environment:
      OPENDECTCELL_HOST: ${OPENDECTCELL_HOST:-opendectcell.example.org}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./deploy/pi/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # the certificates and the account key: back this up, or a rebuild asks for new ones
      - caddy_config:/config
    depends_on:
      controller:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.88.0/24

volumes:
  caddy_data:
  caddy_config:
