version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Best-effort writes whose failure must not change the outcome:
      # audit entries for failed logins, response writes, rollbacks.
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*bytes.Buffer).WriteTo
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Deadlines fail only on a closed connection, where the next read or
        # write fails anyway.
        - (*crypto/tls.Conn).SetDeadline
        - (*crypto/tls.Conn).SetReadDeadline
        - (*crypto/tls.Conn).SetWriteDeadline
    revive:
      # Only the documentation rules: every exported identifier has a doc
      # comment that starts with its name, and every package has a package
      # comment. revive's other default rules are off.
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers # methods that implement an interface need a comment too
            - disableStutteringCheck # cell.CellUp and the like: renaming churns the public API
        - name: package-comments
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this, with the exclusions above
        - G115 # integer conversions: ours are bounded by construction (lengths, identity ids); reviewed per case
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, noctx, bodyclose, revive]
      - path: internal/auth/oidctest/
        linters: [errcheck, gosec]
      # SIP status codes look like HTTP ones but are not.
      - path: internal/sip/
        linters: [usestdlibvars]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openDECTcell/opendectcell-controller
