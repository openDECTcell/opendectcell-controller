# SPDX-License-Identifier: AGPL-3.0-or-later
# Local bring-up: `docker compose up`. See docs/deployment.md.
#
# On first start, `init` creates a master key and database credentials in
# the `secrets` volume. BACK UP THE MASTER KEY separately from the database
# (docs/threat-model.md §4.1): docker compose cp controller:/secrets/master_key .
# For production, replace the volume with your own secret files.

name: opendectcell

services:
  init:
    build:
      context: .
      args:
        # 1: the image has the DECT core (needs the openDECTcell submodule checked out:
        # git submodule update --init). 0: a controller that drops every cell mail.
        LIBOPENDECTCELL: ${LIBOPENDECTCELL:-1}
    image: opendectcell-controller:local
    # the controller's files in `secrets`, the database's administrative ones in `dbsecrets`
    # (docs/deployment.md, "Database roles")
    command: ["init-secrets", "--dir", "/secrets", "--admin-dir", "/dbsecrets"]
    volumes:
      - secrets:/secrets
      - dbsecrets:/dbsecrets
    restart: "no"

  db:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: opendectcell
      POSTGRES_USER: opendectcell
      POSTGRES_PASSWORD_FILE: /dbsecrets/db_password
    volumes:
      - dbsecrets:/dbsecrets:ro
      - pgdata:/var/lib/postgresql
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendectcell -d opendectcell"]
      interval: 3s
      timeout: 5s
      retries: 30
    # only what the image's entrypoint needs to start PostgreSQL as its own user
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Makes the controller's limited database role, applies the schema and grants the role its table rights, as the
  # database's own administrative role: the only service besides `db` that sees those credentials.
  migrate:
    image: opendectcell-controller:local
    command: ["migrate", "up"]
    environment:
      OPENDECTCELL_DATABASE_URL_FILE: /secrets/database_url
      OPENDECTCELL_DATABASE_ADMIN_URL_FILE: /dbsecrets/database_admin_url
      OPENDECTCELL_MASTER_KEY_FILE: /secrets/master_key
      OPENDECTCELL_HTTP_BASE_URL: ${OPENDECTCELL_HTTP_BASE_URL:-http://localhost:8080}
    volumes:
      - secrets:/secrets:ro
      - dbsecrets:/dbsecrets:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  controller:
    image: opendectcell-controller:local
    # the schema is applied by `migrate`, as another database role; this service cannot change it
    command: ["serve", "--no-migrate"]
    environment:
      # a build without the DECT core would drop every cell's mails: refuse to start
      OPENDECTCELL_CELLS_REQUIRE_DECT_CORE: ${OPENDECTCELL_CELLS_REQUIRE_DECT_CORE:-true}
      OPENDECTCELL_DATABASE_URL_FILE: /secrets/database_url
      OPENDECTCELL_MASTER_KEY_FILE: /secrets/master_key
      OPENDECTCELL_HTTP_BASE_URL: ${OPENDECTCELL_HTTP_BASE_URL:-http://localhost:8080}
      # the zone the pages show times in (an IANA name, e.g. Europe/Berlin); the container is on UTC otherwise
      TZ: ${OPENDECTCELL_TZ:-UTC}
      # Docker maps big UDP ranges slowly; 100 ports = 50 calls. For more,
      # widen both, or use network_mode: host (docs/deployment.md).
      OPENDECTCELL_SIP_RTP_PORTS: 41000-41099
      # The cells' speech (a call's audio from the cell to the controller): one
      # UDP port per call. Set OPENDECTCELL_CELLS_MEDIA_IP to this host's address as
      # the cells reach it (docs/deployment.md), or calls have no audio.
      OPENDECTCELL_CELLS_MEDIA_PORTS: 41100-41199
      # The cells' DECT stacks in worker processes (docs/adr/0003-stack-isolation.md): a
      # crash in the C library ends one worker, not the controller. 0: inside the controller.
      OPENDECTCELL_CELLS_STACK_WORKERS: ${OPENDECTCELL_CELLS_STACK_WORKERS:-0}
      # lab switch: 1 puts every DECT segment and message in the log (numbers and secrets left out)
      OPENDECTCELL_DECT_VERBOSE: ${OPENDECTCELL_DECT_VERBOSE:-}
    volumes:
      - secrets:/secrets:ro
      # the backups, read only: the administrators see their state and download the newest one
      - backups:/backups:ro
    # Which host address each service is published on. The default is every address, as a
    # provider and the cells must reach them; set these to one address (a LAN or a VPN address)
    # where that is enough, and see "Network exposure" in docs/deployment.md for the firewall rules.
    ports:
      - "127.0.0.1:8080:8080"
      - "${OPENDECTCELL_CELL_BIND:-0.0.0.0}:7300:7300"
      - "${OPENDECTCELL_SIP_BIND:-0.0.0.0}:5060:5060/udp"
      - "${OPENDECTCELL_SIP_BIND:-0.0.0.0}:5060:5060/tcp"
      - "${OPENDECTCELL_MEDIA_BIND:-0.0.0.0}:41000-41099:41000-41099/udp"
      - "${OPENDECTCELL_MEDIA_BIND:-0.0.0.0}:41100-41199:41100-41199/udp"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # The nightly backup: pg_dump, encrypted with a passphrase of its own, checked by restoring it into a scratch
  # database, optionally copied to an SFTP server (docs/wiki/Operating.md, "Backups"). It sees the database's
  # administrative credentials (read only), like `migrate`. The master key is NOT in the dump and not here: keep it apart.
  backup:
    build: ./deploy/backup
    image: opendectcell-backup:local
    environment:
      TZ: ${OPENDECTCELL_TZ:-UTC}
      BACKUP_AT: ${OPENDECTCELL_BACKUP_AT:-03:15}
      BACKUP_KEEP: ${OPENDECTCELL_BACKUP_KEEP:-14}
      BACKUP_SFTP_TARGET: ${OPENDECTCELL_BACKUP_SFTP_TARGET:-}
      BACKUP_SFTP_PORT: ${OPENDECTCELL_BACKUP_SFTP_PORT:-22}
    volumes:
      - dbsecrets:/dbsecrets:ro
      - backups:/backups
      # the passphrase of the backups, and for SFTP the key (sftp_key) and the server's key (sftp_known_hosts)
      - backup-secrets:/backup-secrets
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    # root only to own its volumes; the work is done as the postgres user
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  secrets:
  dbsecrets:
  pgdata:
  backups:
  backup-secrets:
